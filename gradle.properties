version=6.2.6-SNAPSHOT

org.gradle.caching=true
org.gradle.jvmargs=-Xmx2048m
org.gradle.parallel=true

kotlinVersion=1.9.25

kotlin.jvm.target.validation.mode=ignore
kotlin.stdlib.default.dependency=false

# 强制指定 Gradle 构建使用的 JDK 路径
#org.gradle.java.home=D:\\devspace\\java\\bellsoft-jdk-17.0.18

# Spring Framework 6.2.x 的构建要求同时存在 JDK 17 和 JDK 21，因为项目中有不同 Java 版本的源码集需要分别编译。
org.gradle.java.installations.paths=D:\\devspace\\java\\bellsoft-jdk-17.0.18,D:\\devspace\\java\\bellsoft-jdk-21.0.10

# 关闭 Gradle 自动下载 JDK 的功能
org.gradle.java.installations.auto-download=false